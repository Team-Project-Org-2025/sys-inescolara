services:
  # Servidor web Apache + PHP
  sys-inescolara-app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: sys-inescolara-app
    ports:
      - "${APP_PORT:-9080}:80"
    volumes:
      - .:/var/www/html
    depends_on:
      sys-inescolara-db:
        condition: service_healthy
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
    networks:
      - sys-inescolara-network
    restart: unless-stopped

  # PostgreSQL
  sys-inescolara-db:
    image: postgres:16
    container_name: sys-inescolara-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sys-inescolara-postgres-data:/var/lib/postgresql/data
    networks:
      - sys-inescolara-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s

  # pgAdmin
  sys-inescolara-admin:
    image: dpage/pgadmin4:latest
    container_name: sys-inescolara-pgadmin
    ports:
      - "${PGADMIN_PORT:-9000}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      sys-inescolara-db:
        condition: service_healthy
    networks:
      - sys-inescolara-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  sys-inescolara-network:
    driver: bridge

volumes:
  sys-inescolara-postgres-data: