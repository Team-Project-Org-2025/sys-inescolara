name: API tests (Newman)

on:
  push:
    branches: [ main, develop, feature/postman-api-testing ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  api:
    name: Newman (29 colecciones)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: mariadb:10.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sysinescolara
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, gd, zip, dom, xml
          coverage: none

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm install -g newman newman-reporter-junitfull

      - name: Configurar .env
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=sysinescolara
          DB_USER=root
          DB_PASSWORD=root
          DB_SEC_HOST=127.0.0.1
          DB_SEC_PORT=3306
          DB_SEC_NAME=SysInescolara-Seguridad
          DB_SEC_USER=root
          DB_SEC_PASSWORD=root
          EOF

      - name: Esperar MySQL
        run: |
          command -v mysql >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
          }
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then
              echo "MySQL listo"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL no respondió" >&2
          exit 1

      - name: Cargar esquema, migrar y sembrar
        # Nota: database/sysinescolara_vacia.sql NO desactiva FOREIGN_KEY_CHECKS
        # y su tabla mermas_historico tiene una FK cruzada a
        # SysInescolara-Seguridad.usuarios (creada más abajo en el mismo dump).
        # En una BD fresca eso falla con errno 150, así que se importa con
        # foreign_key_checks=0 (la FK queda registrada y valida en runtime).
        run: |
          mysql -h127.0.0.1 -uroot -proot --init-command="SET FOREIGN_KEY_CHECKS=0" < database/sysinescolara_vacia.sql
          php scripts/migrate.php
          mysql -h127.0.0.1 -uroot -proot < pruebas/data/seed.sql
          mysql -h127.0.0.1 -uroot -proot < pruebas/data/seed-seguridad.sql

      - name: Levantar servidor y ejecutar colecciones
        run: |
          # El servidor y las pruebas van en el MISMO paso: así el proceso en
          # segundo plano no corre el riesgo de que el runner lo mate al cerrar
          # el paso (ECONNREFUSED en newman).
          php -S 127.0.0.1:8000 tests/aceptacion/server/router.php > /tmp/php-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 15); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/login; then
              echo "Servidor listo"
              break
            fi
            sleep 2
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:8000/login; then
            echo "El servidor embebido no respondió. Log:" >&2
            cat /tmp/php-server.log >&2
            exit 1
          fi

          mkdir -p results
          set -uo pipefail
          failed=0
          for f in pruebas/collections/*/*.postman_collection.json; do
            name=$(basename "$f" .postman_collection.json)
            echo "=== $name ==="
            newman run "$f" \
              -e "pruebas/environments/SysInescolara Local.postman_environment.json" \
              --env-var "baseUrl=http://127.0.0.1:8000" \
              --env-var "password=${{ secrets.POSTMAN_ADMIN_PASSWORD || 'Admin123!' }}" \
              --env-var "viewerPassword=${{ secrets.POSTMAN_VIEWER_PASSWORD || 'Postman123!' }}" \
              --reporters cli,junitfull \
              --reporter-junitfull-export "results/$name.xml" || failed=1
          done
          exit $failed

      - name: Subir log del servidor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-server-log
          path: /tmp/php-server.log
          if-no-files-found: ignore

      - name: Subir resultados JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-junit
          path: results/
          if-no-files-found: ignore

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, dom
          coverage: none
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Ejecutar PHPUnit
        run: |
          cp .env.example .env
          mkdir -p results
          vendor/bin/phpunit -c tests/phpunit.xml --log-junit results/phpunit.xml
      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-junit
          path: results/
          if-no-files-found: ignore

  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint
        run: |
          find app -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l index.php
